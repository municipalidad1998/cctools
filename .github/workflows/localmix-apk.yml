name: LocalMix APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'music-player/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build LocalMix
        working-directory: music-player
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalMix-debug-apk
          path: music-player/app/build/outputs/apk/debug/*.apk
